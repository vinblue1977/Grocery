name: Dependabot auto-merge

# Dependabot PRs merge themselves once the required checks pass. After any merge into main (ours or Dependabot's),
# the open Dependabot PRs that are behind main are asked to rebase.
# Both steps use AUTOMERGE_TOKEN (a fine-grained PAT, stored as an Actions and a Dependabot secret) instead
# of GITHUB_TOKEN: a merge made by GITHUB_TOKEN starts no push run (so no deploy), and a branch update made
# by it starts no checks. The token needs Contents, Pull requests, Actions and Workflows write on this repo.
#
# pull_request_target is what lets a Dependabot PR read secrets. It is safe here because nothing in this
# workflow checks out or runs code from the PR; it only calls `gh` with the PR number.

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, closed]

permissions: {}  # the token below does the work; GITHUB_TOKEN gets nothing

jobs:
  # Turns on auto-merge; GitHub merges when the required checks pass and the branch is up to date.
  enable:
    if: github.event.action != 'closed' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - run: gh pr merge --auto --squash "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  # A merge leaves the open Dependabot PRs behind main (branch protection wants them up to date). Dependabot
  # rebases its own PRs, which also starts their checks; `gh pr update-branch` would make it refuse to. Only PRs
  # that are actually behind get the comment, so an up-to-date one isn't rebuilt for nothing.
  rebase-behind:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged
      && github.event.pull_request.base.ref == 'main'
    concurrency:
      group: dependabot-rebase  # overlapping merges queue instead of racing each other's rebases
      cancel-in-progress: false
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - run: |
          gh pr list --repo "$REPO" --author 'app/dependabot' --base main --state open \
            --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' |
          while read -r pr branch; do
            behind="$(gh api "repos/$REPO/compare/main...$branch" --jq .behind_by)"
            if [ "$behind" -gt 0 ]; then
              gh pr comment "$pr" --repo "$REPO" --body '@dependabot rebase'
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
